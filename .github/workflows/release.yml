name: Release

on:
  workflow_dispatch

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Trusted publishing: nuget.org issues a short lived api key to a workflow it trusts, so the
    # account needs no long lived key to leak. Declaring any permission drops every other one to
    # none, and checking out the code needs contents.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Tests
        run: dotnet test --configuration Release

      - name: Read version from file
        id: version
        run: echo "VERSION=$(cat semver.txt)" >> $GITHUB_ENV

      - name: Package release
        id: package_release
        run: |
          OUTPUT=${{ runner.temp }}/nupkgs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          echo "core_package_name=openapi2excel.core.$VERSION.nupkg" >> $GITHUB_OUTPUT
          echo "core_package_filename=$OUTPUT/openapi2excel.core.$VERSION.nupkg" >> $GITHUB_OUTPUT
          
          echo "tool_package_name=openapi2excel.cli.$VERSION.nupkg" >> $GITHUB_OUTPUT
          echo "tool_package_filename=$OUTPUT/openapi2excel.cli.$VERSION.nupkg" >> $GITHUB_OUTPUT
          
          dotnet build --configuration Release /p:Version=$VERSION
          dotnet pack --configuration Release /p:Version=$VERSION /p:PackageOutputPath=$OUTPUT

      # The key is valid for an hour, so it is asked for right before it is used. One key pushes
      # both packages, the token it was exchanged for is what cannot be used twice.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          # The profile name on nuget.org owning the packages, not an email address.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" ${{ steps.package_release.outputs.core_package_filename }}
          dotnet nuget push --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" ${{ steps.package_release.outputs.tool_package_filename }}